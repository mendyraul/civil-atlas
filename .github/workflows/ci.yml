name: CI
on: [push, pull_request]
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.api.yml config --quiet
        env:
          CIVIL_ATLAS_API_ENV_FILE: .env.home-lab.example
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every file must map to a license in REUSE.toml (code AGPL, data ODbL, docs CC BY).
      - uses: fsfe/reuse-action@v5
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://civil_atlas:civil_atlas@localhost:5432/civil_atlas
    services:
      postgres:
        image: postgis/postgis:16-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: civil_atlas
          POSTGRES_USER: civil_atlas
          POSTGRES_PASSWORD: civil_atlas
        options: >-
          --health-cmd "pg_isready -U civil_atlas -d civil_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt' }
      - run: pip install -r backend/requirements-mcp.txt
      - run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U civil_atlas -d civil_atlas && break
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U civil_atlas -d civil_atlas
          PGPASSWORD=civil_atlas psql -h localhost -U civil_atlas -d civil_atlas -f db/init/001_init.sql
          PGPASSWORD=civil_atlas psql -h localhost -U civil_atlas -d civil_atlas -f db/init/002_repository_integrity.sql
          PGPASSWORD=civil_atlas psql -h localhost -U civil_atlas -d civil_atlas -f db/init/003_publication_state.sql
          PGPASSWORD=civil_atlas psql -h localhost -U civil_atlas -d civil_atlas -f db/init/004_postgis_and_external_ids.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: civil_atlas
          PGDATABASE: civil_atlas
          PGPASSWORD: civil_atlas
      - run: python -m app.seed.import_world117 --publish --actor ci:fixture
        working-directory: backend
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.ci.invalid
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_MAP_STYLE_URL: /map-styles/minimal.json
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env: { NEXT_PUBLIC_DEMO_MODE: 'true' }
      - run: npx playwright test e2e/basemap-failure.spec.ts
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_MAP_STYLE_URL: 'http://127.0.0.1:3000/unavailable-style.json'
      - run: npm run test:licensing
        working-directory: frontend
